aid: forerunner-ventures
name: Forerunner Ventures
description: >-
  Forerunner Ventures is an early-stage venture capital firm founded in 2012 by
  Kirsten Green and headquartered in San Francisco, California. Forerunner backs
  founders building category-defining companies, investing with early conviction
  at the seed and Series A stages (with selective pre-seed), typically writing
  initial checks in the $1M-$15M range. The firm invests across consumer,
  commerce, health and wellness, consumer finance, marketplaces and services,
  personal systems, and platforms and infrastructure, increasingly viewed
  through AI lenses (AI as agent, AI as infrastructure, AI as intelligence
  layer). Forerunner has raised nearly $3B in assets under management across
  seven flagship funds, with its most recent Fund VII a $500M early-stage
  vehicle. Its portfolio includes category leaders such as Chime, Warby Parker,
  Glossier, Hims & Hers, Oura, Faire, The Farmer's Dog, Dollar Shave Club,
  Curology, Away, Ritual, and Chime, along with a growing cohort of AI-native
  companies including Decagon, Suno, Slingshot AI, and Monarch Money.
